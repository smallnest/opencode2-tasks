name: Release

on:
  push:
    tags:
      - "v*"
  # Lets a release be re-run at an existing tag without deleting and
  # recreating it: `gh workflow run release.yml --ref v0.1.0`
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          # Deliberately no dependency cache in a release build.

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --engine-strict=false

      - name: Verify
        run: npm run check

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Preferred: npm trusted publishing (OIDC). Because this job has
          # `id-token: write`, npm exchanges an OIDC token for a short-lived
          # publish credential and ignores the token below.
          #
          # Fallback: a granular access token with "Bypass 2FA" enabled.
          # Tokens without that option are rejected with E403, and the
          # package must already exist before a trusted publisher can be
          # configured — see the Releasing section in CONTRIBUTING.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
